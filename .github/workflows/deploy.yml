name: deploy as gihub page

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3'
          gleam-version: '1.19.2'
      - run: gleam deps download
      - run: gleam run -m lustre/dev build --minify --outdir=dist
      - name: Fix paths for GitHub Pages
        run: sed -i -r 's|/[a-z]+\.[a-z]+|.\0|g' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v5
